[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hockeyai-generator"
version = "0.1.0"
description = "Deterministic synthetic hockey data generator"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "plotly>=5.24,<7",
    "psutil>=5.9,<8",
    "pyarrow>=17,<25",
    "streamlit>=1.41,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["hockeyai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
